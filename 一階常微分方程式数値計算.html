<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>一階常微分方程式シミュレーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Math.js -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.2.1/lib/browser/math.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-[100dvh] lg:h-[100dvh] flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center z-10 shadow-sm shrink-0">
    <div>
      <h1 class="text-lg md:text-xl font-bold text-blue-600 tracking-tight">一階微分方程式</h1>
      <p class="text-[10px] md:text-xs text-slate-500 font-medium">ルンゲ-クッタ法で数値計算</p>
    </div>
    <div>
      <button id="exportCsv" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 px-3 rounded-md transition shadow-sm border border-slate-200">
        CSV出力
      </button>
    </div>
  </header>

  <!-- メインコンテンツ (モバイル: 縦スクロール, PC: 横並び固定) -->
  <div class="flex flex-col lg:flex-row flex-1 overflow-y-auto lg:overflow-hidden">
    
    <!-- グラフエリア (モバイル: 上部, PC: 右側) -->
    <main class="flex flex-col p-2 lg:p-4 bg-slate-50 order-1 lg:order-2 w-full lg:w-auto lg:flex-1 shrink-0 h-[45vh] lg:h-full">
      <div class="bg-white rounded-xl p-3 lg:p-4 shadow-sm border border-slate-200 flex-1 flex flex-col relative h-full">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-2 z-10 gap-2">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Solution Graph \(y(x)\)</span>
          <div id="errorMetric" class="text-[11px] font-mono text-slate-500 bg-slate-50 px-2 py-1 rounded hidden border border-slate-200">
            最大誤差: <span id="maxErrorVal" class="text-blue-600 font-bold">-</span>
          </div>
        </div>
        <div class="flex-1 relative w-full h-full min-h-0">
          <canvas id="chartCanvas"></canvas>
        </div>
      </div>
    </main>

    <!-- コントロールパネル (モバイル: 下部, PC: 左側スクロール) -->
    <aside class="w-full lg:w-[420px] bg-white border-r border-slate-200 flex flex-col order-2 lg:order-1 shrink-0 lg:overflow-y-auto pb-10 lg:pb-0">
      <div class="p-4 space-y-6">
        
        <!-- プリセット -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Math Templates</label>
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-btn text-[11px] bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-2 py-1.5 rounded transition" data-expr="a*y" data-ana="y0 * exp(a*(x - x0))">自然増殖 (線形)</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="a*y*(1 - y/b)" data-ana="b / (1 + (b/y0 - 1)*exp(-a*(x - x0)))">ロジスティック</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="a*x + b*y" data-ana="">線形非同次</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="y^2 - x^2 + 1" data-ana="">リッカチ形 (非線形)</button>
          </div>
        </div>

        <!-- 数式入力 & プレビュー -->
        <div class="bg-blue-50/40 p-3 rounded-xl border border-blue-100">
          <label class="text-[10px] font-bold text-blue-500 uppercase tracking-wider block mb-1">Differential Equation</label>
          
          <div class="min-h-[44px] flex items-center justify-center bg-white rounded-lg border border-blue-100 mb-2 p-2 overflow-x-auto shadow-inner">
            <div id="mathPreview" class="text-blue-900 text-lg"></div>
          </div>

          <textarea id="exprInput" rows="1" class="w-full bg-white border border-slate-200 rounded-lg p-2 font-mono text-sm focus:outline-none focus:border-blue-400 transition" placeholder="a*y*(1 - y/b)">a*y*(1 - y/b)</textarea>
          <p class="text-[10px] text-slate-500 mt-1">独立変数: <code>x</code>, 従属変数: <code>y</code> | 定数: <code>a</code>, <code>b</code></p>
        </div>

        <!-- パラメータスライダー群 -->
        <div class="space-y-3">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Parameters</label>
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>定数 \(a\)</span><span id="val-a">1.0</span>
              </div>
              <input type="range" id="param-a" min="-5" max="5" step="0.1" value="1.0" class="w-full accent-blue-500">
            </div>
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>定数 \(b\)</span><span id="val-b">5.0</span>
              </div>
              <input type="range" id="param-b" min="-10" max="10" step="0.1" value="5.0" class="w-full accent-blue-500">
            </div>
          </div>
        </div>

        <!-- 計算条件 -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Boundary & Steps</label>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">初期値 \(x_0\)</label>
              <input type="number" id="x0" value="0.0" step="0.1" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-blue-400 outline-none transition">
            </div>
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">初期値 \(y_0 = y(x_0)\)</label>
              <input type="number" id="y0" value="0.1" step="0.1" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-blue-400 outline-none transition">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">終点 \(x_{end}\)</label>
              <input type="number" id="x1" value="10.0" step="0.5" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-blue-400 outline-none transition">
            </div>
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">分割数 \(N\)</label>
              <input type="number" id="nSteps" value="1000" step="100" min="10" max="5000" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-blue-400 outline-none transition">
            </div>
          </div>
        </div>

        <!-- 解析解 (オプション) -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 border-dashed">
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Analytic Solution (Optional)</label>
          <textarea id="analyticInput" rows="1" class="w-full bg-white border border-slate-200 rounded-lg p-2 font-mono text-sm focus:outline-none focus:border-blue-400 transition" placeholder="理論解 y(x) がわかる場合は入力..."></textarea>
          <p class="text-[10px] text-slate-400 mt-1">※入力するとグラフ上に重ねて誤差を計算します</p>
        </div>

        <!-- エラー表示 -->
        <div id="errorBox" class="hidden text-xs bg-red-50 text-red-600 p-2 rounded-lg border border-red-200 font-mono"></div>
        
      </div>
    </aside>
  </div>

  <script>
    let simData = { xs: [], ys: [], anaYs: [] };
    let chartInstance = null;

    // UI Elements
    const exprInput = document.getElementById('exprInput');
    const analyticInput = document.getElementById('analyticInput');
    const mathPreview = document.getElementById('mathPreview');
    const errorBox = document.getElementById('errorBox');
    const errorMetric = document.getElementById('errorMetric');
    const maxErrorVal = document.getElementById('maxErrorVal');
    
    // Convert text math to LaTeX for KaTeX
    function updateMathPreview() {
      let expr = exprInput.value;
      let latex = expr
        .replace(/\*/g, '')
        .replace(/sin/g, '\\sin')
        .replace(/cos/g, '\\cos')
        .replace(/exp/g, '\\exp')
        .replace(/log/g, '\\ln');
      
      const fullLatex = `\\frac{dy}{dx} = ${latex}`;
      try {
        katex.render(fullLatex, mathPreview, { throwOnError: false, displayMode: true });
        errorBox.classList.add('hidden');
      } catch (e) {}
    }

    // Parameters linking
    const paramsList = ['a', 'b'];
    paramsList.forEach(p => {
      const slider = document.getElementById(`param-${p}`);
      const valDisp = document.getElementById(`val-${p}`);
      slider.addEventListener('input', () => {
        valDisp.textContent = parseFloat(slider.value).toFixed(1);
        runSimulation(); 
      });
    });

    // Preset Buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        exprInput.value = e.target.dataset.expr;
        analyticInput.value = e.target.dataset.ana || '';
        updateMathPreview();
        runSimulation();
      });
    });

    // Event Listeners for auto-recalculation
    ['exprInput', 'analyticInput', 'x0', 'y0', 'x1', 'nSteps'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if(id === 'exprInput') updateMathPreview();
        runSimulation();
      });
    });

    // CSV Export
    document.getElementById('exportCsv').addEventListener('click', () => {
      if (simData.xs.length === 0) return;
      let csv = 'x,y_numerical' + (analyticInput.value ? ',y_analytic\n' : '\n');
      for (let i = 0; i < simData.xs.length; i++) {
        csv += `${simData.xs[i]},${simData.ys[i]}`;
        if (simData.anaYs.length > 0) csv += `,${simData.anaYs[i]}`;
        csv += '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ode1_result.csv';
      a.click();
    });

    // RK4 Solver (Synchronous for real-time slider updates)
    function runSimulation() {
      const expr = exprInput.value.trim();
      const anaExpr = analyticInput.value.trim();
      
      const pValues = {
        a: parseFloat(document.getElementById('param-a').value),
        b: parseFloat(document.getElementById('param-b').value),
        e: Math.E,
        pi: Math.PI
      };

      const x0 = parseFloat(document.getElementById('x0').value);
      const y0 = parseFloat(document.getElementById('y0').value);
      const x1 = parseFloat(document.getElementById('x1').value);
      const nSteps = parseInt(document.getElementById('nSteps').value) || 1000;

      if (isNaN(x0) || isNaN(y0) || isNaN(x1) || nSteps <= 0) return;

      let compiledNum, compiledAna = null;
      try {
        compiledNum = math.parse(expr).compile();
        if (anaExpr) compiledAna = math.parse(anaExpr).compile();
        errorBox.classList.add('hidden');
      } catch (err) {
        errorBox.textContent = "数式構文エラー";
        errorBox.classList.remove('hidden');
        return;
      }

      const h = (x1 - x0) / nSteps;
      let xi = x0, yi = y0;
      
      simData = { xs: [xi], ys: [yi], anaYs: [] };
      let maxErr = 0;
      let hasAna = false;

      // Initial Analytic Eval
      if (compiledAna) {
        try {
          // Pass x0, y0 as context if analytical solution relies on them
          let scope = Object.assign({ x: xi, x0: x0, y0: y0 }, pValues);
          let ya = compiledAna.evaluate(scope);
          simData.anaYs.push(ya);
          hasAna = true;
        } catch (e) {}
      }

      try {
        for (let i = 1; i <= nSteps; i++) {
          let scope = Object.assign({ x: xi, y: yi }, pValues);
          const k1 = h * compiledNum.evaluate(scope);
          
          scope.x = xi + h/2; scope.y = yi + k1/2;
          const k2 = h * compiledNum.evaluate(scope);
          
          scope.y = yi + k2/2;
          const k3 = h * compiledNum.evaluate(scope);
          
          scope.x = xi + h; scope.y = yi + k3;
          const k4 = h * compiledNum.evaluate(scope);
          
          yi += (k1 + 2*k2 + 2*k3 + k4) / 6;
          xi = x0 + i * h;
          
          simData.xs.push(xi);
          simData.ys.push(yi);

          if (hasAna) {
            let aScope = Object.assign({ x: xi, x0: x0, y0: y0 }, pValues);
            let ya = compiledAna.evaluate(aScope);
            simData.anaYs.push(ya);
            let err = Math.abs(ya - yi);
            if (err > maxErr) maxErr = err;
          }
        }
      } catch (err) {
        errorBox.textContent = "計算エラー: 発散したか不正な値です";
        errorBox.classList.remove('hidden');
        return;
      }
      
      // Update Error Metric UI
      if (hasAna) {
        errorMetric.classList.remove('hidden');
        maxErrorVal.textContent = maxErr.toExponential(3);
      } else {
        errorMetric.classList.add('hidden');
      }

      updateChart();
    }

    // Chart.js rendering
    function updateChart() {
      const ctx = document.getElementById('chartCanvas').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let labels = simData.xs.map(x => x.toFixed(2));
      let datasets = [
        { 
          label: '数値解 y(x) [RK4]', 
          data: simData.ys, 
          borderColor: '#2563eb', 
          backgroundColor: 'rgba(37, 99, 235, 0.1)', 
          borderWidth: 2, 
          pointRadius: 0, 
          tension: 0.1, 
          fill: true 
        }
      ];

      if (simData.anaYs.length > 0) {
        datasets.push({
          label: '解析解 y(x) [理論値]', 
          data: simData.anaYs, 
          borderColor: '#f59e0b', 
          borderDash: [5, 5],
          borderWidth: 2, 
          pointRadius: 0, 
          tension: 0.1
        });
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 0 }, 
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { type: 'linear', title: { display: true, text: '独立変数 x' } },
            y: { title: { display: true, text: '従属変数 y' } }
          },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { boxWidth: 12, usePointStyle: true } },
            tooltip: { enabled: true }
          }
        }
      });
    }

    // Initialize
    window.addEventListener('load', () => {
      updateMathPreview();
      runSimulation();
    });
  </script>
</body>
</html>
