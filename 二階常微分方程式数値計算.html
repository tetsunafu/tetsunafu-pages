<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>二階常微分方程式シミュレーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Math.js -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- MathJax -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<!-- モバイルでは画面全体スクロール、PCでは100dvhで固定 -->
<body class="bg-slate-50 text-slate-800 font-sans min-h-[100dvh] lg:h-[100dvh] flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center z-10 shadow-sm shrink-0">
    <div>
      <h1 class="text-lg md:text-xl font-bold text-indigo-600 tracking-tight">二階常微分方程式シミュレーター</h1>
      <p class="text-[10px] md:text-xs text-slate-500 font-medium">二階常微分方程式の数値計算</p>
    </div>
  </header>

  <!-- メインコンテンツ (モバイル: 縦スクロール, PC: 横並び固定) -->
  <div class="flex flex-col lg:flex-row flex-1 overflow-y-auto lg:overflow-hidden">
    
    <!-- グラフエリア (モバイル: 上部, PC: 右側) -->
    <main class="flex flex-col p-2 lg:p-4 bg-slate-50 order-1 lg:order-2 w-full lg:w-auto lg:flex-1 shrink-0 h-[50vh] lg:h-full">
      <div class="bg-white rounded-xl p-3 lg:p-4 shadow-sm border border-slate-200 flex-1 flex flex-col relative h-full">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-2 z-10 gap-2">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Solution Graph</span>
          <select id="graphMode" class="text-xs border border-slate-200 rounded-md p-1.5 bg-slate-50 font-medium text-slate-700 outline-none focus:border-indigo-400 transition">
            <option value="time">時系列 $x(t), v(t)$</option>
            <option value="phase">位相空間 ( $x$ vs $v$ )</option>
            <option value="energy">エネルギー推移 ( $K, U, E$ ) ※復元力係数=b</option>
          </select>
        </div>
        <div class="flex-1 relative w-full h-full min-h-0">
          <canvas id="chartCanvas"></canvas>
        </div>
      </div>
    </main>

    <!-- コントロールパネル (モバイル: 下部, PC: 左側スクロール) -->
    <aside class="w-full lg:w-[400px] bg-white border-r border-slate-200 flex flex-col order-2 lg:order-1 shrink-0 lg:overflow-y-auto pb-10 lg:pb-0">
      <div class="p-4 space-y-6">
        
        <!-- プリセット -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Equation Templates</label>
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-btn text-[11px] bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-2 py-1.5 rounded transition" data-expr="-b*x">単振動</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="-a*v - b*x">減衰振動</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="-a*v - b*x + c*sin(omega*t)">強制振動</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="-a*v - b*x + c*sin(omega*t)">RLC直列回路 (q'')</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="a*(1 - x^2)*v - x">ファンデルポール</button>
            <button class="preset-btn text-[11px] bg-slate-100 text-slate-600 hover:bg-slate-200 font-semibold px-2 py-1.5 rounded transition" data-expr="-a*v - b*x - c*x^3 + d*cos(omega*t)">ダフィング (非線形/カオス)</button>
          </div>
        </div>

        <!-- 数式入力 & プレビュー -->
        <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100">
          <label class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider block mb-1">Equation</label>
          
          <div class="min-h-[44px] flex items-center justify-center bg-white rounded-lg border border-indigo-100 mb-2 p-2 overflow-x-auto">
            <div id="mathPreview" class="text-indigo-900 text-lg"></div>
          </div>

          <textarea id="exprInput" rows="2" class="w-full bg-white border border-slate-200 rounded-lg p-2 font-mono text-sm focus:outline-none focus:border-indigo-400 transition" placeholder="-a*v - b*x">-a*v - b*x</textarea>
          <p class="text-[10px] text-slate-500 mt-1">変数: <code>t</code>, <code>x</code>, <code>v</code> | パラメータ: <code>a</code>, <code>b</code>, <code>c</code>, <code>d</code>, <code>omega</code></p>
        </div>

        <!-- パラメータスライダー群 -->
        <div class="space-y-3">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Parameters</label>
          
          <div class="grid grid-cols-2 gap-3">
            <!-- a -->
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>係数 \(a\)</span><span id="val-a">0.2</span>
              </div>
              <input type="range" id="param-a" min="-5" max="5" step="0.1" value="0.2" class="w-full accent-indigo-500">
            </div>
            <!-- b -->
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>係数 \(b\)</span><span id="val-b">1.0</span>
              </div>
              <input type="range" id="param-b" min="-5" max="5" step="0.1" value="1.0" class="w-full accent-indigo-500">
            </div>
            <!-- c -->
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>係数 \(c\)</span><span id="val-c">0.0</span>
              </div>
              <input type="range" id="param-c" min="-5" max="5" step="0.1" value="0.0" class="w-full accent-indigo-500">
            </div>
            <!-- d -->
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>係数 \(d\)</span><span id="val-d">0.0</span>
              </div>
              <input type="range" id="param-d" min="-5" max="5" step="0.1" value="0.0" class="w-full accent-indigo-500">
            </div>
            <!-- omega -->
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 col-span-2">
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>角周波数 \(\omega\)</span><span id="val-omega">1.0</span>
              </div>
              <input type="range" id="param-omega" min="0" max="10" step="0.1" value="1.0" class="w-full accent-indigo-500">
            </div>
          </div>
        </div>

        <!-- 初期条件 -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Initial Conditions</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">初期値 \(x(0)\)</label>
              <input type="number" id="x0" value="1.0" step="0.1" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-indigo-400 outline-none transition">
            </div>
            <div>
              <label class="text-xs text-slate-500 font-semibold block mb-1">初期値 \(v(0)\)</label>
              <input type="number" id="v0" value="0.0" step="0.1" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm font-mono focus:border-indigo-400 outline-none transition">
            </div>
          </div>
        </div>

        <!-- エラー表示 -->
        <div id="errorBox" class="hidden text-xs bg-red-50 text-red-600 p-2 rounded-lg border border-red-200 font-mono"></div>
        
      </div>
    </aside>
  </div>

  <script>
    let simData = { times: [], xs: [], vs: [] };
    let chartInstance = null;

    const exprInput = document.getElementById('exprInput');
    const mathPreview = document.getElementById('mathPreview');
    const errorBox = document.getElementById('errorBox');
    const graphMode = document.getElementById('graphMode');

    function updateMathPreview() {
      let expr = exprInput.value;
      let latex = expr
        .replace(/\*/g, '')
        .replace(/v/g, 'x\'')
        .replace(/omega/g, '\\omega')
        .replace(/sin/g, '\\sin')
        .replace(/cos/g, '\\cos');
      
      const fullLatex = `x'' = ${latex}`;
      try {
        katex.render(fullLatex, mathPreview, { throwOnError: false, displayMode: true });
        errorBox.classList.add('hidden');
      } catch (e) {}
    }

    const paramsList = ['a', 'b', 'c', 'd', 'omega'];
    paramsList.forEach(p => {
      const slider = document.getElementById(`param-${p}`);
      const valDisp = document.getElementById(`val-${p}`);
      slider.addEventListener('input', () => {
        valDisp.textContent = parseFloat(slider.value).toFixed(1);
        runSimulation(); 
      });
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        exprInput.value = e.target.dataset.expr;
        updateMathPreview();
        runSimulation();
      });
    });

    exprInput.addEventListener('input', () => {
      updateMathPreview();
      runSimulation();
    });

    document.getElementById('x0').addEventListener('input', runSimulation);
    document.getElementById('v0').addEventListener('input', runSimulation);
    graphMode.addEventListener('change', updateChart);

    function runSimulation() {
      const expr = exprInput.value;
      
      const pValues = {
        a: parseFloat(document.getElementById('param-a').value),
        b: parseFloat(document.getElementById('param-b').value),
        c: parseFloat(document.getElementById('param-c').value),
        d: parseFloat(document.getElementById('param-d').value),
        omega: parseFloat(document.getElementById('param-omega').value)
      };

      const x0 = parseFloat(document.getElementById('x0').value) || 0;
      const v0 = parseFloat(document.getElementById('v0').value) || 0;

      let compiled;
      try {
        compiled = math.parse(expr).compile();
        errorBox.classList.add('hidden');
      } catch (err) {
        errorBox.textContent = "数式エラー: 構文を確認してください";
        errorBox.classList.remove('hidden');
        return;
      }

      const dt = 0.05;
      const steps = 800; // 40秒分
      let t = 0, x = x0, v = v0;

      simData = { times: [0], xs: [x0], vs: [v0] };

      const f = (tVal, vVal, xVal) => {
        return compiled.evaluate(Object.assign({ t: tVal, v: vVal, x: xVal }, pValues));
      };

      try {
        for (let i = 0; i < steps; i++) {
          const k1v = f(t, v, x);
          const k1x = v;
          const k2v = f(t + dt/2, v + dt/2 * k1v, x + dt/2 * k1x);
          const k2x = v + dt/2 * k1v;
          const k3v = f(t + dt/2, v + dt/2 * k2v, x + dt/2 * k2x);
          const k3x = v + dt/2 * k2v;
          const k4v = f(t + dt, v + dt * k3v, x + dt * k3x);
          const k4x = v + dt * k3v;

          v += (dt / 6) * (k1v + 2*k2v + 2*k3v + k4v);
          x += (dt / 6) * (k1x + 2*k2x + 2*k3x + k4x);
          t += dt;

          simData.times.push(t);
          simData.xs.push(x);
          simData.vs.push(v);
        }
      } catch (err) {
        errorBox.textContent = "計算エラー: 実行できません";
        errorBox.classList.remove('hidden');
        return;
      }
      updateChart();
    }

    function updateChart() {
      const mode = graphMode.value;
      const ctx = document.getElementById('chartCanvas').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      let datasets = [];
      let labels = simData.times.map(t => t.toFixed(2));

      if (mode === 'time') {
        datasets = [
          { label: 'x(t) [位置/状態]', data: simData.xs, borderColor: '#4f46e5', backgroundColor: 'rgba(79, 70, 229, 0.1)', borderWidth: 2, pointRadius: 0, tension: 0.1, fill: true },
          { label: 'v(t) [速度/変化率]', data: simData.vs, borderColor: '#10b981', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, tension: 0.1 }
        ];
      } else if (mode === 'phase') {
        datasets = [{
          label: '位相空間 (x vs v)',
          data: simData.xs.map((x, i) => ({ x: x, y: simData.vs[i] })),
          borderColor: '#8b5cf6',
          borderWidth: 1.5,
          pointRadius: 0,
          showLine: true
        }];
      } else if (mode === 'energy') {
        // エネルギー計算 (m=1と仮定)
        const b = parseFloat(document.getElementById('param-b').value) || 0;
        const kinetic = simData.vs.map(v => 0.5 * v * v);
        const potential = simData.xs.map(x => 0.5 * b * x * x);
        const total = kinetic.map((k, i) => k + potential[i]);

        datasets = [
          { label: '運動エネルギー K', data: kinetic, borderColor: '#f43f5e', borderWidth: 2, pointRadius: 0, tension: 0.1 },
          { label: 'ポテンシャル U', data: potential, borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, tension: 0.1 },
          { label: '力学的エネルギー E', data: total, borderColor: '#1e293b', borderDash: [5, 5], borderWidth: 2, pointRadius: 0, tension: 0.1 }
        ];
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: mode !== 'phase' ? labels : undefined, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 0 }, 
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { type: mode !== 'phase' ? 'category' : 'linear', title: { display: true, text: mode !== 'phase' ? '時間 t' : '位置 x' } },
            y: { title: { display: true, text: mode === 'phase' ? '速度 v' : '値' } }
          },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { boxWidth: 12, usePointStyle: true } },
            tooltip: { enabled: true }
          }
        }
      });
    }

    window.addEventListener('load', () => {
      updateMathPreview();
      runSimulation();
    });
  </script>
</body>
</html>
