<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有機化合物分類マップ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        body { background-color: #0b0f19; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .node circle { cursor: pointer; transition: all 0.25s ease-in-out; }
        .node circle:hover { stroke-width: 4px !important; filter: drop-shadow(0 0 12px currentColor); }
        .node-label-container { display: flex; align-items: center; white-space: nowrap; pointer-events: none; user-select: none; transition: opacity 0.3s ease; text-shadow: 0 0 4px #0b0f19, 0 0 2px #0b0f19; }
        .link { fill: none; stroke: #334155; stroke-opacity: 0.6; stroke-width: 1px; transition: stroke 0.3s, stroke-width 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        #smiles-canvas { background-color: #f8fafc; border-radius: 0.5rem; width: 100%; height: 200px; }
    </style>
</head>
<body class="text-slate-100 h-screen overflow-hidden flex flex-col select-none">

    <header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-6 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-emerald-600/30 border border-emerald-500/50 flex items-center justify-center text-emerald-400 font-bold text-xl shadow-lg">
                <i class="fa-solid fa-flask"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-white leading-tight">有機化合物分類マップ</h1>
                <p class="text-xs text-slate-400">代表的な有機化合物を視覚的に分類（※情報の正確性については保証しかねます）</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 w-full max-w-md">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="物質名で検索 (例: ピクリン酸, メタン)..." 
                       class="w-full bg-slate-800/80 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 placeholder-slate-500 transition-all">
            </div>
            <button id="btn-reset-zoom" title="視点を全体に戻す" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg border border-slate-700 shrink-0 transition flex items-center gap-1.5">
                <i class="fa-solid fa-compress text-slate-400"></i>
                <span>全体復帰</span>
            </button>
        </div>
    </header>

    <div class="flex-1 relative overflow-hidden flex">
        <svg id="tree-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>

        <div class="absolute bottom-6 left-6 bg-slate-900/90 backdrop-blur border border-slate-800 p-4 rounded-xl shadow-2xl z-10 text-xs space-y-2 max-w-xs">
            <div class="font-semibold text-slate-300 border-b border-slate-800 pb-1.5 flex justify-between items-center">
                <span>骨格・元素による分類</span>
                <span id="zoom-level-badge" class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-emerald-400 font-mono">Zoom: 100%</span>
            </div>
            <div class="grid grid-cols-1 gap-1.5 pointer-events-auto">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-500 shrink-0"></span>1. 脂肪族炭化水素</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-fuchsia-500 shrink-0"></span>2. 芳香族炭化水素</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-orange-500 shrink-0"></span>3. 含酸素化合物</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-indigo-500 shrink-0"></span>4. 含窒素・硫黄化合物</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500 shrink-0"></span>5. 生体高分子・合成樹脂</div>
            </div>
            <div class="text-[11px] text-slate-400 pt-1 border-t border-slate-800/60 leading-relaxed">
                Source: <a href="https://ja.wikipedia.org/wiki/%E6%9C%89%E6%A9%9F%E5%8C%96%E5%90%88%E7%89%A9%E3%81%AE%E4%B8%80%E8%A6%A7" target="_blank" class="text-emerald-400 hover:text-emerald-300 underline">Wikipedia</a>
            </div>
        </div>

        <aside id="detail-drawer" class="absolute top-0 right-0 h-full w-[480px] bg-slate-900/95 backdrop-blur-md border-l border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-300 z-20 flex flex-col p-6 overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <span id="drawer-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Category</span>
                <button id="btn-close-drawer" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="mt-4">
                <h2 id="drawer-title" class="text-2xl font-bold text-white tracking-wide">物質名</h2>
                <p id="drawer-subtitle" class="text-sm font-mono text-emerald-400 mt-1">一般式</p>
            </div>

            <div class="mt-4 w-full flex justify-center relative group">
                <canvas id="smiles-canvas"></canvas>
            </div>

            <div class="mt-6 space-y-5 text-sm">
                <div>
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-book-open text-emerald-400"></i> 解説・特徴
                    </h3>
                    <div id="drawer-desc" class="text-slate-300 leading-relaxed text-xs bg-slate-800/30 p-3.5 rounded-lg border border-slate-800/50 select-text space-y-2"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const organicHierarchy = {
            name: "有機化合物", latex: "\\text{Organic Compounds}", category: "Root", color: "#64748b",
            children: [
                {
                    name: "1. 脂肪族炭化水素", category: "Hydrocarbons", color: "#06b6d4",
                    children: [
                        { name: "アルカン", latex: "C_nH_{2n+2}", color: "#06b6d4", children: [
                            { name: "メタン", latex: "CH_4", smiles: "C", desc: "天然ガスの主成分。実験室では無水酢酸ナトリウムとソーダ石灰を加熱して製する。無色無臭の気体で水に溶けにくい。" },
                            { name: "エタン", latex: "C_2H_6", smiles: "CC", desc: "融点は-148度[cite: 18]。石油分解ガスから分離して製造される常温で無色の気体。" },
                            { name: "プロパン", latex: "C_3H_8", smiles: "CCC", desc: "LPガスの主成分。石油精製の副生ガスとして得られ、家庭用燃料として広く利用される。" },
                            { name: "ブタン", latex: "C_4H_10", smiles: "CCCC", desc: "ライターの燃料やカセットボンベに用いられる。天然ガスから分離される。" },
                            { name: "ペンタン", latex: "C_5H_{12}", smiles: "CCCCC", desc: "常温で無色の液体。発泡スチロールの物理発泡剤や溶媒として利用される。" },
                            { name: "ヘキサン", latex: "C_6H_{14}", smiles: "CCCCCC", desc: "無極性溶媒として抽出などに多用される。粗製ガソリンから分留して得られる。" },
                            { name: "ヘプタン", latex: "C_7H_{16}", smiles: "CCCCCCC", desc: "ガソリンのアンチノック性を示すオクタン価0の基準となる標準物質。" },
                            { name: "オクタン", latex: "C_8H_{18}", smiles: "CCCCCCCC", desc: "ガソリンの主成分の一つ。炭素数8の直鎖アルカン。" },
                            { name: "ノナン", latex: "C_9H_{20}", smiles: "CCCCCCCCC", desc: "引火性の液体で、有機溶媒や燃料の成分として利用される。" },
                            { name: "デカン", latex: "C_{10}H_{22}", smiles: "CCCCCCCCCC", desc: "炭素数10の直鎖アルカン。重質なガソリン成分に含まれる。" },
                            { name: "イソブタン", latex: "C_4H_{10}", smiles: "CC(C)C", desc: "ブタンの構造異性体。エアロゾルスプレーの噴射剤や冷媒として利用される。" }
                        ]},
                        { name: "アルケン", latex: "C_nH_{2n}", color: "#06b6d4", children: [
                            { name: "エチレン", latex: "C_2H_4", smiles: "C=C", desc: "植物ホルモンの一つ。実験室ではエタノールと濃硫酸を170℃で加熱して製する。臭素水の赤褐色を脱色する事で検出可能。" },
                            { name: "プロペン", latex: "C_3H_6", smiles: "C=CC", desc: "ポリプロピレンの原料。ナフサの熱分解で大量に生産される。" },
                            { name: "1-ブテン", latex: "C_4H_8", smiles: "C=CCC", desc: "二重結合が末端にあるブテン。ポリエチレンの共重合モノマーとして利用。" },
                            { name: "2-ブテン", latex: "C_4H_8", smiles: "CC=CC", desc: "シス-トランス異性体が存在する。石油の接触分解生成物から分離される。" },
                            { name: "イソブテン", latex: "C_4H_8", smiles: "CC(=C)C", desc: "メチルプロペン。酸触媒で水和するとt-ブタノールになる。" },
                            { name: "1-ペンテン", latex: "C_5H_{10}", smiles: "C=CCCC", desc: "炭素数5の直鎖末端アルケン。" },
                            { name: "1-ヘキセン", latex: "C_6H_{12}", smiles: "C=CCCCC", desc: "無色の液体で、主にポリエチレンのコモノマーとして工業的に製造される。" },
                            { name: "1-オクテン", latex: "C_8H_{16}", smiles: "C=CCCCCCC", desc: "洗剤や可塑剤の合成原料として利用される。" },
                            { name: "シクロヘキセン", latex: "C_6H_{10}", smiles: "C1=CCCCC1", desc: "環状アルケン。シクロヘキサノールの酸触媒下での脱水反応で製する。" },
                            { name: "1-デセン", latex: "C_{10}H_{20}", smiles: "C=CCCCCCCCC", desc: "合成潤滑油の原料として利用される炭素数10のアルケン。" }
                        ]},
                        { name: "アルキン", latex: "C_nH_{2n-2}", color: "#06b6d4", children: [
                            { name: "アセチレン", latex: "C_2H_2", smiles: "C#C", desc: "融点-80.8度、沸点-84度[cite: 18]。炭化カルシウムに水を加えるか、メタンの部分酸化で製する。アンモニア性硝酸銀水溶液で白色沈殿を生じる。" },
                            { name: "プロピン", latex: "C_3H_4", smiles: "C#CC", desc: "メチルアセチレンとも呼ばれる。溶接ガスの成分として用いられる。" },
                            { name: "1-ブチン", latex: "C_4H_6", smiles: "C#CCC", desc: "末端アルキンであり、銀鏡反応に似た末端アルキンの金属塩生成反応を示す。" },
                            { name: "2-ブチン", latex: "C_4H_6", smiles: "CC#CC", desc: "内部アルキンであり、末端アルキンのような金属置換反応を示さない。" },
                            { name: "1-ペンチン", latex: "C_5H_8", smiles: "C#CCCC", desc: "炭素数5の末端アルキン。" },
                            { name: "1-ヘキシン", latex: "C_6H_{10}", smiles: "C#CCCCC", desc: "有機合成の基質としてよく利用される末端アルキン。" },
                            { name: "1-オクチン", latex: "C_8H_{14}", smiles: "C#CCCCCCC", desc: "末端アルキンの一般的な性質を示す炭素数8の液体。" },
                            { name: "フェニルアセチレン", latex: "C_8H_6", smiles: "C#Cc1ccccc1", desc: "芳香環を持つ末端アルキン。薗頭カップリングの基質として重宝される。" },
                            { name: "3-ヘキシン", latex: "C_6H_{10}", smiles: "CCC#CCC", desc: "対称構造を持つ内部アルキン。" },
                            { name: "1-デシン", latex: "C_{10}H_{18}", smiles: "C#CCCCCCCCC", desc: "炭素数10の末端アルキン。" }
                        ]},
                        { name: "シクロアルカン", latex: "C_nH_{2n}", color: "#06b6d4", children: [
                            { name: "シクロプロパン", latex: "C_3H_6", smiles: "C1CC1", desc: "環の歪みが非常に大きく、付加反応（開環）を起こしやすい。かつて全身麻酔薬として使われた。" },
                            { name: "シクロブタン", latex: "C_4H_8", smiles: "C1CCC1", desc: "環の歪みが大きく不安定。シクロブタンジカルボン酸からの脱炭酸などで製する。" },
                            { name: "シクロペンタン", latex: "C_5H_{10}", smiles: "C1CCCC1", desc: "比較的安定な5員環構造。石油エーテル中に含まれる。" },
                            { name: "シクロヘキサン", latex: "C_6H_{12}", smiles: "C1CCCCC1", desc: "いす型配座をとり、極めて安定な溶媒。工業的にはベンゼンの水素化により製造される。" },
                            { name: "シクロヘプタン", latex: "C_7H_{14}", smiles: "C1CCCCCC1", desc: "7員環のシクロアルカン。クレメンゼン還元などで合成される。" },
                            { name: "シクロオクタン", latex: "C_8H_{16}", smiles: "C1CCCCCCC1", desc: "8員環構造を持ち、冠型や舟-いす型などの複雑な配座をとる。" },
                            { name: "デカリン", latex: "C_{10}H_{18}", smiles: "C1CCC2CCCCC2C1", desc: "2つのシクロヘキサン環が縮合した構造。ナフタレンの完全水素化で製造される。" },
                            { name: "メチルシクロヘキサン", latex: "C_7H_{14}", smiles: "CC1CCCCC1", desc: "トルエンの水素化で得られる無色の液体溶媒。" },
                            { name: "エチルシクロヘキサン", latex: "C_8H_{16}", smiles: "CCC1CCCCC1", desc: "エチルベンゼンの還元などで得られる有機合成溶媒。" },
                            { name: "スピロデカン", latex: "C_{10}H_{18}", smiles: "C2CCC1(CCCCC1)C2", desc: "1つの炭素原子を共有する2つの環を持つスピロ化合物[cite: 18]。" }
                        ]},
                        { name: "ジエン", latex: "C_nH_{2n-2}", color: "#06b6d4", children: [
                            { name: "1,3-ブタジエン", latex: "C_4H_6", smiles: "C=CC=C", desc: "共役ジエンの代表。ナフサの熱分解で大量に得られ、合成ゴムの主原料となる。" },
                            { name: "イソプレン", latex: "C_5H_8", smiles: "CC(=C)C=C", desc: "融点-145.95度、沸点34.067度[cite: 18]。天然ゴムを構成するモノマー単位であり、合成ゴムの原料。" },
                            { name: "クロロプレン", latex: "C_4H_5Cl", smiles: "C=C(Cl)C=C", desc: "2-クロロ-1,3-ブタジエン。耐候性・耐油性に優れたネオプレンゴムの原料。" },
                            { name: "シクロペンタジエン", latex: "C_5H_6", smiles: "C1=CCC=C1", desc: "ディールス・アルダー反応のジエンとして非常に反応性が高く、常温で二量化してジシクロペンタジエンになる。" },
                            { name: "1,4-ペンタジエン", latex: "C_5H_8", smiles: "C=CCC=C", desc: "二重結合がメチレン基で隔てられた非共役ジエン。" },
                            { name: "1,5-ヘキサジエン", latex: "C_6H_{10}", smiles: "C=CCCC=C", desc: "加熱によりコープ転位を起こす基質として知られる。" },
                            { name: "ミルセン", latex: "C_{10}H_{16}", smiles: "CC(C)=CCCC(=C)C=C", desc: "テルペン系炭化水素の一種で、香料の原料として重要。" },
                            { name: "アレン", latex: "C_3H_4", smiles: "C=C=C", desc: "プロパジエン。累積二重結合を持つ最も単純な化合物で、独特の直交したπ結合構造を持つ。" },
                            { name: "1,3-シクロヘキサジエン", latex: "C_6H_8", smiles: "C1=CCCC=C1", desc: "シクロヘキセンよりさらに不飽和度が高い共役環状ジエン。" },
                            { name: "1,4-シクロヘキサジエン", latex: "C_6H_8", smiles: "C1=CCC=CC1", desc: "バーチ還元によってベンゼンから合成される非共役環状ジエン。" }
                        ]}
                    ]
                },
                {
                    name: "2. 芳香族炭化水素", category: "Aromatics", color: "#d946ef",
                    children: [
                        { name: "ベンゼン・アルキルベンゼン", latex: "C_6H_6, C_6H_5-R", color: "#d946ef", children: [
                            { name: "ベンゼン", latex: "C_6H_6", smiles: "c1ccccc1", desc: "芳香族化合物の基本骨格。触媒改質などによりナフサから製造される。特有の臭気を持つ有毒液体。" },
                            { name: "トルエン", latex: "C_7H_8", smiles: "Cc1ccccc1", desc: "メチルベンゼン。ナフサの接触改質で製造され、溶剤やTNTの原料となる。" },
                            { name: "o-キシレン", latex: "C_8H_{10}", smiles: "Cc1ccccc1C", desc: "オルト位に2つのメチル基を持つ。酸化すると無水フタル酸が得られる。" },
                            { name: "m-キシレン", latex: "C_8H_{10}", smiles: "Cc1cccc(C)c1", desc: "メタ位に2つのメチル基を持つ。酸化してイソフタル酸の原料となる。" },
                            { name: "p-キシレン", latex: "C_8H_{10}", smiles: "Cc1ccc(C)cc1", desc: "パラ位に2つのメチル基を持つ。酸化してテレフタル酸の原料となり、PET樹脂製造に不可欠。" },
                            { name: "エチルベンゼン", latex: "C_8H_{10}", smiles: "CCc1ccccc1", desc: "エチレンとベンゼンからフリーデル・クラフツ反応で合成。スチレンの主原料。" },
                            { name: "スチレン", latex: "C_8H_8", smiles: "C=Cc1ccccc1", desc: "融点-30.6度、沸点145度[cite: 18]。エチルベンゼンの脱水素で製造され、ポリスチレンの原料となる。" },
                            { name: "クメン", latex: "C_9H_{12}", smiles: "CC(C)c1ccccc1", desc: "イソプロピルベンゼン。プロペンとベンゼンから合成され、クメン法でフェノールとアセトンの原料になる。" },
                            { name: "メシチレン", latex: "C_9H_{12}", smiles: "Cc1cc(C)cc(C)c1", desc: "1,3,5-トリメチルベンゼン。濃硫酸触媒下でのアセトンの脱水縮合で合成可能。" },
                            { name: "p-シメン", latex: "C_{10}H_{14}", smiles: "CC(C)c1ccc(C)cc1", desc: "4-イソプロピルトルエン。精油中に存在し、テルペン類に分類される香料成分。" }
                        ]},
                        { name: "多環芳香族", latex: "\\text{Polycyclic}", color: "#d946ef", children: [
                            { name: "ナフタレン", latex: "C_{10}H_8", smiles: "c1ccc2ccccc2c1", desc: "ベンゼン環が2つ縮合。コールタールから分留される。特有の臭気を持ち、昇華性がある。" },
                            { name: "アントラセン", latex: "C_{14}H_{10}", smiles: "c1ccc2cc3ccccc3cc2c1", desc: "融点218度、沸点342度[cite: 18]。ベンゼン環が3つ直線状に縮合。特有の蛍光を示し、染料の原料になる。" },
                            { name: "フェナントレン", latex: "C_{14}H_{10}", smiles: "c1ccc2c(c1)ccc3ccccc32", desc: "ベンゼン環が3つ折れ曲がって縮合。アントラセンの構造異性体。" },

                            { name: "ポリプロピレン (PP)", latex: "(-CH_2-CH(CH_3)-)_n", smiles: "C=CC", desc: "プロピレンの重合で得られ、ポリエチレンより耐熱性と機械的強度が高い。ヒンジ部分などに利用。" },
                            { name: "ポリメタクリル酸メチル (PMMA)", latex: "\\text{PMMA}", smiles: "C=C(C)C(=O)OC", desc: "メタクリル酸メチルの重合。極めて透明性が高く「有機ガラス」「アクリルガラス」と呼ばれる。" },
                            { name: "ポリテトラフルオロエチレン (PTFE)", latex: "(-CF_2-CF_2-)_n", smiles: "FC(F)=C(F)F", desc: "テトラフルオロエチレンの重合。テフロンとして知られ、耐熱性・耐薬品性・非粘着性に極めて優れる。" },
                            { name: "フェノール樹脂", latex: "\\text{Phenolic}", smiles: "Oc1ccccc1.C=O", desc: "フェノールとホルムアルデヒドの縮合重合（ベークライト）。酸触媒でノボラック、塩基触媒でレゾールを経由する熱硬化性樹脂。" },
                            { name: "尿素樹脂", latex: "\\text{Urea}", smiles: "NC(=O)N.C=O", desc: "ユリア樹脂。尿素とホルムアルデヒドの付加縮合で得られる熱硬化性樹脂で、ボタンや接着剤に用いられる。" }
                        ]}
                    ]
                }
            ]
        };

        const container = document.getElementById('tree-canvas');
        let width = container.clientWidth || window.innerWidth;
        let height = container.clientHeight || window.innerHeight;

        const svg = d3.select("#tree-canvas");
        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 8])
            .on("zoom", (event) => {
                const scale = event.transform.k;
                g.attr("transform", event.transform);
                document.getElementById('zoom-level-badge').innerText = `Zoom: ${Math.round(scale * 100)}%`;
                
                // 追加：ズーム倍率を打ち消すための逆スケールを計算
                // Math.pow(scale, -0.8) とすることで、ズームイン時に「ほんの少しだけ」ラベルが大きくなる自然な挙動になります。
                // ※完全にサイズを固定したい場合は `const labelScale = 1 / scale;` としてください。
                const labelScale = Math.pow(scale, -0.8);

                d3.selectAll(".node").each(function(d) {
                    const labelObj = d3.select(this).select("foreignObject");
                    
                    // 追加：ラベルに逆スケールを適用し、見かけのサイズと距離を維持
                    labelObj.attr("transform", `scale(${labelScale})`);

                    if (d.depth === 3) {
                        labelObj.style("opacity", scale >= 0.8 ? 1 : 0);
                    } else if (d.depth === 2) {
                        labelObj.style("opacity", scale >= 0.4 ? 1 : 0);
                    } else {
                        labelObj.style("opacity", 1);
                    }
                });
            });

        svg.call(zoom);

        const radius = 3000; 
        const treeLayout = d3.tree()
            .size([2 * Math.PI, radius])
            .separation((a, b) => (a.parent == b.parent ? 1 : 1.5) / a.depth);

        const root = d3.hierarchy(organicHierarchy);
        treeLayout(root);

        function project(angle, radius) {
            const x = radius * Math.cos(angle - Math.PI / 2);
            const y = radius * Math.sin(angle - Math.PI / 2);
            return [x, y];
        }

        const linkGenerator = d3.linkRadial()
            .angle(d => d.x)
            .radius(d => d.y);

        g.selectAll(".link")
            .data(root.links())
            .enter()
            .append("path")
            .attr("class", "link")
            .attr("d", linkGenerator);

        const nodes = g.selectAll(".node")
            .data(root.descendants())
            .enter()
            .append("g")
            .attr("class", "node")
            .attr("transform", d => {
                const [x, y] = project(d.x, d.y);
                return `translate(${x},${y})`;
            })
            .on("click", (event, d) => {
                event.stopPropagation();
                if(d.depth === 3) {
                    openDrawer(d.data, d.parent.data);
                }
            });

        nodes.append("circle")
            .attr("r", d => d.depth === 0 ? 18 : (d.depth === 3 ? 5 : (d.children ? 10 : 6)))
            .attr("fill", d => {
                if (d.depth === 3) return d.parent.data.color || "#ffffff";
                return d.data.color || "#06b6d4";
            })
            .attr("stroke", d => {
                let c = d.depth === 3 ? d.parent.data.color : d.data.color;
                return c ? d3.rgb(c).brighter(0.8) : "#22d3ee";
            })
            .attr("stroke-width", d => d.depth === 3 ? "1px" : "2px");

        const labelG = nodes.append("foreignObject")
            .attr("width", 180)
            .attr("height", 46)
            .attr("x", d => {
                // 円の左右でテキストの配置基準を変えつつ、少し外側に押し出す
                return (d.x > 0 && d.x < Math.PI) ? 14 : -194;
            })
            .attr("y", d => {
                // 上下の頂点付近はY座標をずらして重なりを回避
                const isTop = d.x < Math.PI / 2 || d.x > Math.PI * 3 / 2;
                return isTop ? -36 : 14;
            })
            .style("overflow", "visible")
            .style("pointer-events", "none");

        labelG.append("xhtml:div")
            .attr("class", "node-label-container text-xs text-slate-200")
            .style("justify-content", d => (d.x < Math.PI) ? "flex-start" : "flex-end")
            .html(d => {
                let displayFormula = "";
                if (d.data.latex) {
                    displayFormula = (d.data.latex.includes('_') || d.data.latex.includes('^') || d.data.latex.includes('\\')) 
                                     ? `\\(${d.data.latex}\\)` : d.data.latex;
                }
                const isLeaf = d.depth === 3;
                const bgClass = isLeaf ? "bg-slate-900/60 border-slate-700/50" : "bg-slate-900/90 border-slate-800/80 shadow-sm font-medium";
                
                // flex-col を付与して名前と式を縦に並べる（改行効果）
                return `<div class="${bgClass} px-2 py-1 rounded border flex flex-col items-center gap-0.5 text-center">
                            <span class="leading-tight">${d.data.name}</span> 
                            ${displayFormula ? `<span class="text-[10px] text-slate-400 font-mono leading-none">${displayFormula}</span>` : ""}
                        </div>`;
            });

        const initialTransform = d3.zoomIdentity.translate(width / 2, height / 2).scale(0.35);
        svg.call(zoom.transform, initialTransform);

        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;
        });

        let smilesDrawer = new SmilesDrawer.Drawer({
            width: 432,
            height: 200,
            themes: {
                dark: { C: '#94a3b8', O: '#f43f5e', N: '#3b82f6', S: '#eab308', F: '#10b981', CL: '#10b981', BR: '#8b5cf6', I: '#c026d3', BACKGROUND: '#f8fafc' }
            }
        });

        const drawer = document.getElementById('detail-drawer');

        function openDrawer(data, parentData) {
            document.getElementById('drawer-title').innerText = data.name.replace(/ \//, '');
            const formulaHTML = (data.latex && (data.latex.includes('_') || data.latex.includes('\\'))) ? `\\(${data.latex}\\)` : (data.latex || 'N/A');
            document.getElementById('drawer-subtitle').innerHTML = formulaHTML;
            document.getElementById('drawer-badge').innerText = parentData.name || 'Subclass';
            document.getElementById('drawer-badge').style.backgroundColor = `${parentData.color}33`;
            document.getElementById('drawer-badge').style.color = parentData.color;
            document.getElementById('drawer-badge').style.borderColor = `${parentData.color}4D`;

            document.getElementById('drawer-desc').innerHTML = data.desc ? `<p>${data.desc}</p>` : '説明データなし';

            const canvas = document.getElementById('smiles-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (data.smiles) {
                SmilesDrawer.parse(data.smiles, function(tree) {
                    smilesDrawer.draw(tree, 'smiles-canvas', 'dark', false);
                }, function(err) {
                    console.error("SMILES parse error:", err);
                });
            }

            drawer.classList.remove('translate-x-full');
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('detail-drawer')]);
            }
        }

        document.getElementById('btn-close-drawer').addEventListener('click', () => {
            drawer.classList.add('translate-x-full');
        });

        document.getElementById('btn-reset-zoom').addEventListener('click', () => {
            svg.transition().duration(750).call(zoom.transform, initialTransform);
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            if (!q) {
                nodes.selectAll("circle")
                    .attr("r", d => d.depth === 0 ? 18 : (d.depth === 3 ? 5 : (d.children ? 10 : 6)))
                    .attr("stroke-width", d => d.depth === 3 ? "1px" : "2px");
                return;
            }

            nodes.each(function(d) {
                const nameMatch = d.data.name && d.data.name.toLowerCase().includes(q);
                const isMatch = nameMatch;

                d3.select(this).select("circle")
                    .attr("r", isMatch ? 14 : (d.depth === 3 ? 3 : 6))
                    .attr("stroke", isMatch ? "#fde047" : (d.depth === 3 ? d3.rgb(d.parent.data.color).brighter(0.8) : d3.rgb(d.data.color).brighter(0.8)))
                    .attr("stroke-width", isMatch ? "4px" : "1px");

                if (isMatch && d.depth === 3) {
                    const [x, y] = project(d.x, d.y);
                    const transform = d3.zoomIdentity
                        .translate(width / 2 - x * 1.5, height / 2 - y * 1.5)
                        .scale(1.5);
                    svg.transition().duration(750).call(zoom.transform, transform);
                    openDrawer(d.data, d.parent.data);
                }
            });
        });

        window.addEventListener('load', () => {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
