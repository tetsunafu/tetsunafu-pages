<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>劣化版JavaScriptアラートたち</title>
</head>
<body>
    <!--コピペ：HTMLここから-->
    <dialog id="AlertElement">
        <h1>このページの内容</h1>
        <p id="AlertText"></p>
        <form method="dialog">
            <button class="ACPDialogOK">閉じる</button>
        </form>
    </dialog>
    <dialog id="ConfirmElement">
        <h1>このページの内容</h1>
        <p id="ConfirmText"></p>
        <form method="dialog">
            <button class="ACPDialogOK">OK</button><button class="ACPDialogCancel">キャンセル</button>
        </form>
    </dialog>
    <dialog id="PromptElement">
        <h1>このページの内容</h1>
        <p id="PromptText"></p>
        <form method="dialog">
            <p><input type="text" id="PromptInput"></p>
            <button class="ACPDialogOK">OK</button><button class="ACPDialogCancel">キャンセル</button>
        </form>
    </dialog>
    <!--コピペ：HTMLここまで-->
    <button onclick="DialogAlert('これはalert．これはalert．これはalert．これはalert．これはalert．これはalert．これはalert．')">alert</button>
    <button onclick="DialogConfirm('これはconfirm．これはconfirm．これはconfirm．これはconfirm．これはconfirm．これはconfirm．これはconfirm．')">confirm</button>
    <button onclick="DialogPrompt('これはprompt．これはprompt．これはprompt．これはprompt．これはprompt．これはprompt．これはprompt．')">prompt</button>
</body>

<!--コピペ：CSS,JavaScriptここから-->
<style>
    #AlertElement, #ConfirmElement, #PromptElement {
        width: 50vw;
        min-width: 250px;
        max-width: 500px;
        min-height: 100px;
        border: none;
        border-radius: 10px;
        filter: drop-shadow(2px 2px 2px rgb(96, 96, 96));
        background-color: white;
    }
    :is(#AlertElement, #ConfirmElement, #PromptElement) * {
        background-color: white;
    }
    #AlertText, #ConfirmText, #PromptText {
        font-size: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        text-align: justify;
    }
    :is(#AlertElement, #ConfirmElement, #PromptElement) > form[method="dialog"] {
        text-align: right;
    }
    :is(#AlertElement, #ConfirmElement, #PromptElement) > h1 {
        font-size: 17px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-weight: bold;
        color: black;
    }
    #PromptElement > form[method="dialog"]  input {
        width: -webkit-fill-available;
    }
    .ACPDialogOK {
        width: 90px;
        height: 30px;
        border: solid 1px darkgray;
        border-radius: 3px;
        font-size: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        padding: 0;
        margin: 3px 5px;
        background-color: rgb(67 133 245) !important;
        color: white;
    }
    .ACPDialogOK:hover {
        background-color: rgb(97, 149, 240) !important;
    }
    .ACPDialogCancel {
        width: 90px;
        height: 30px;
        border: solid 1px darkgray;
        border-radius: 3px;
        font-size: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        padding: 0;
        margin: 3px 5px;
        background-color: white;
        color: black;
    }
    .ACPDialogCancel:hover {
        background-color: rgb(219, 219, 219) !important;
    }
</style>
<script>
    function DialogAlert(HTMLtext) {
        document.getElementById('AlertText').innerHTML = String(HTMLtext)
        document.getElementById('AlertElement').showModal()
    }
    async function DialogConfirm(HTMLtext) {
        document.getElementById('ConfirmText').innerHTML = String(HTMLtext)
        document.getElementById('ConfirmElement').showModal()
    }
    function DialogPrompt(HTMLtext) {
        let dialog = document.getElementById('PromptElement')
        document.getElementById('PromptText').innerHTML = String(HTMLtext)

        return new Promise(resolve => {
            // `close` イベントで input の値を取得
            dialog.addEventListener("close", () => {
                const inputValue = document.getElementById('PromptInput').value;
                resolve(inputValue); // `Promise` の解決値を `input` の値にする
            }, { once: true });

            // ダイアログを開く
            dialog.showModal();
        });
    }

    (async () => {
        const result = await DialogPrompt("Hello"); // `await` で `Promise` の結果を取得
        console.log("ダイアログの返り値:", result); // input の中身だけが返る
    })();


</script>
<!--コピペ：CSS,JavaScriptここまで-->
</html>
