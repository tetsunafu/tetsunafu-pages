<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>文字列画像変換</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    /* キャンバスのピクセルをくっきり表示させる */
    canvas { image-rendering: pixelated; }
    
    /* ドラッグ＆ドロップ時のハイライト */
    .drag-over { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0">
    <div>
      <h1 class="text-xl font-bold text-indigo-600 tracking-tight flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        PixeLetter Studio
      </h1>
      <p class="text-xs text-slate-500 font-medium mt-1">Unicodeの文字列をパリティ付きでピクセルカラーに可逆変換</p>
    </div>
  </header>

  <!-- メインワークスペース -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
    
    <!-- 左側: テキストエリア (Encode) -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="bg-slate-100/50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Text Editor</h2>
        <span id="textStats" class="text-xs font-mono text-slate-500 bg-white px-2 py-1 rounded border border-slate-200">文字数: 0</span>
      </div>
      
      <div class="p-4 flex-1 flex flex-col">
        <textarea id="textInput" class="w-full h-full min-h-[300px] resize-none focus:outline-none font-mono text-sm leading-relaxed text-slate-700 placeholder-slate-400" placeholder="ここに文字列を入力してください。&#10;絵文字や日本語、改行もそのまま画像に保存されます。"></textarea>
      </div>

      <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex gap-2 flex-wrap">
        <button id="btnEncode" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-sm flex justify-center items-center gap-2">
          文字列を画像に変換
        </button>
        <button id="btnClearText" class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 font-medium py-2 px-4 rounded-lg transition">
          クリア
        </button>
      </div>
    </div>

    <!-- 右側: 画像エリア (Decode) -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="bg-slate-100/50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">🖼️ Pixel Canvas</h2>
        <span id="canvasStats" class="text-xs font-mono text-slate-500 bg-white px-2 py-1 rounded border border-slate-200">サイズ: 0x0</span>
      </div>

      <div class="p-4 flex-1 flex flex-col items-center justify-center relative">
        <!-- ドロップゾーン & キャンバス表示 -->
        <div id="dropZone" class="w-full flex-1 min-h-[300px] border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center bg-slate-50 transition-colors relative overflow-hidden group">
          
          <div id="placeholderText" class="text-center p-4 pointer-events-none text-slate-400 group-hover:text-indigo-500 transition-colors">
            <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <p class="text-sm font-medium">生成された画像がここに表示されます</p>
            <p class="text-xs mt-1">または復元したいPNG画像をドラッグ＆ドロップ</p>
          </div>

          <!-- 実際のデータ保持用（非表示） -->
          <canvas id="hiddenCanvas" class="hidden"></canvas>
          
          <!-- プレビュー用（拡大表示） -->
          <canvas id="previewCanvas" class="absolute hidden max-w-[90%] max-h-[90%] object-contain shadow-lg rounded ring-1 ring-slate-900/10"></canvas>
        </div>
      </div>

      <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex gap-2 justify-between flex-wrap">
        <div class="flex gap-2">
          <label class="text-xs font-bold text-slate-500 flex items-center gap-2">
            プレビュー拡大率
            <select id="scaleSelect" class="bg-white border border-slate-200 rounded p-1 outline-none text-slate-700">
              <option value="4">x4</option>
              <option value="8">x8</option>
              <option value="16" selected>x16</option>
              <option value="32">x32</option>
            </select>
          </label>
        </div>
        <div class="flex gap-2">
          <input type="file" id="fileInput" accept="image/png" class="hidden">
          <button id="btnUpload" class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 font-medium py-2 px-3 rounded-lg transition text-sm">
            画像を選択
          </button>
          <button id="btnDownload" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold py-2 px-4 rounded-lg transition flex justify-center items-center gap-2 shadow-sm pointer-events-none opacity-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            PNG保存
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- UI Elements ---
    const textInput = document.getElementById('textInput');
    const textStats = document.getElementById('textStats');
    const btnEncode = document.getElementById('btnEncode');
    const btnClearText = document.getElementById('btnClearText');
    
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const placeholderText = document.getElementById('placeholderText');
    const canvasStats = document.getElementById('canvasStats');
    const scaleSelect = document.getElementById('scaleSelect');
    
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnDownload = document.getElementById('btnDownload');

    // --- Core Logic (From Original Specifications) ---

    // 文字列をサロゲートペア対応で配列化
    const charArrayFromString = (s) => Array.from(s);
    const toHex2 = (n) => n.toString(16).padStart(2, '0');

    // 文字 -> 6桁Hex (パリティ1桁 + 文字コード5桁)
    function stringToHex6(ch) {
      const cp = ch.codePointAt(0);
      const hex5 = cp.toString(16).padStart(5, '0');
      // Hex文字列の各桁の合計を16で割った余りをパリティとする
      const sum = [...hex5].reduce((a, d) => a + parseInt(d, 16), 0);
      const parity = (sum % 16).toString(16);
      return (parity + hex5).toLowerCase();
    }

    // 6桁Hex -> 文字 (パリティチェック)
    function hex6ToChar(hex6) {
      if (!/^[0-9a-f]{6}$/i.test(hex6)) return '';
      const parity = parseInt(hex6[0], 16);
      const body = hex6.slice(1);
      const sum = [...body].reduce((a, d) => a + parseInt(d, 16), 0);
      
      // パリティが一致しない場合は不正データとして空文字を返す
      if (sum % 16 !== parity) return ''; 
      
      const cp = parseInt(body, 16);
      try { return String.fromCodePoint(cp); } catch(e) { return ''; }
    }

    // --- Encode (Text -> Image) ---
    function encodeTextToCanvas() {
      const text = textInput.value || '';
      const chars = charArrayFromString(text);
      const len = chars.length;
      
      if (len === 0) {
        hiddenCanvas.width = 1; hiddenCanvas.height = 1;
        updatePreview();
        return;
      }

      // ピクセルが収まる最小の正方形を計算
      const n = Math.max(1, Math.ceil(Math.sqrt(len)));
      hiddenCanvas.width = n;
      hiddenCanvas.height = n;
      
      const ctx = hiddenCanvas.getContext('2d');
      const imgData = ctx.createImageData(n, n);
      const data = imgData.data;

      const codes = chars.map(stringToHex6);
      
      // 余った領域は黒 (0x000000 = 空文字扱い) でパディング
      while (codes.length < n * n) codes.push('000000');

      for (let i = 0; i < codes.length; i++) {
        const hex = codes[i];
        data[i * 4]     = parseInt(hex.slice(0, 2), 16); // R
        data[i * 4 + 1] = parseInt(hex.slice(2, 4), 16); // G
        data[i * 4 + 2] = parseInt(hex.slice(4, 6), 16); // B
        data[i * 4 + 3] = 255;                           // Alpha
      }
      
      ctx.putImageData(imgData, 0, 0);
      
      canvasStats.textContent = `サイズ: ${n}x${n}`;
      updatePreview();
      enableDownload(true);
    }

    // --- Decode (Image -> Text) ---
    function decodeCanvasToText(imgElement) {
      hiddenCanvas.width = imgElement.width;
      hiddenCanvas.height = imgElement.height;
      
      const ctx = hiddenCanvas.getContext('2d');
      ctx.drawImage(imgElement, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
      const data = imgData.data;
      
      let outText = '';
      
      for (let i = 0; i < data.length; i += 4) {
        const hex6 = toHex2(data[i]) + toHex2(data[i+1]) + toHex2(data[i+2]);
        // 黒(000000) またはパリティエラーに到達したら読み込み終了
        const ch = hex6ToChar(hex6);
        if (!ch) break;
        outText += ch;
      }
      
      textInput.value = outText;
      updateTextStats();
      canvasStats.textContent = `サイズ: ${hiddenCanvas.width}x${hiddenCanvas.height}`;
      updatePreview();
      enableDownload(true);
    }

    // --- Render Preview ---
    function updatePreview() {
      if (hiddenCanvas.width === 0 || hiddenCanvas.height === 0) {
        previewCanvas.classList.add('hidden');
        placeholderText.classList.remove('hidden');
        return;
      }
      
      const scale = parseInt(scaleSelect.value);
      previewCanvas.width = hiddenCanvas.width * scale;
      previewCanvas.height = hiddenCanvas.height * scale;
      
      const ctx = previewCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false; // ピクセルアートをぼやかさない
      ctx.drawImage(hiddenCanvas, 0, 0, previewCanvas.width, previewCanvas.height);
      
      previewCanvas.classList.remove('hidden');
      placeholderText.classList.add('hidden');
    }

    // --- Event Listeners ---

    const updateTextStats = () => {
      textStats.textContent = `文字数: ${charArrayFromString(textInput.value).length}`;
    };

    textInput.addEventListener('input', updateTextStats);
    
    btnEncode.addEventListener('click', encodeTextToCanvas);
    
    btnClearText.addEventListener('click', () => {
      textInput.value = '';
      updateTextStats();
      hiddenCanvas.width = 0;
      hiddenCanvas.height = 0;
      updatePreview();
      enableDownload(false);
      canvasStats.textContent = `サイズ: 0x0`;
    });

    scaleSelect.addEventListener('change', updatePreview);

    // 画像アップロード・D&D処理
    btnUpload.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleImageFile(file);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleImageFile(file);
    });

    function handleImageFile(file) {
      const img = new Image();
      img.onload = () => {
        decodeCanvasToText(img);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }

    // ダウンロード機能
    function enableDownload(enabled) {
      if (enabled) {
        btnDownload.classList.remove('pointer-events-none', 'opacity-50');
      } else {
        btnDownload.classList.add('pointer-events-none', 'opacity-50');
      }
    }

    btnDownload.addEventListener('click', () => {
      if (hiddenCanvas.width === 0) return;
      const link = document.createElement('a');
      link.download = 'pixeletter.png';
      link.href = hiddenCanvas.toDataURL('image/png');
      link.click();
    });

    // 初期化
    updateTextStats();
  </script>
</body>
</html>
